<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pose Studio Lite — 姿势驱动图生图（复现版）</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<header class="header">
  <a class="brand" href="/">
    <span class="brand-icon">姿</span>
    <span class="brand-text">
      <b>姿作 <small>POSE STUDIO LITE</small></b>
      <span class="badge"><i></i>本地复现 · 127.0.0.1</span>
    </span>
  </a>
  <div class="header-note">姿势库 <b id="poseTotal">—</b> 个 · 双参考图管线</div>
</header>

<main>
  <div class="intro">
    <div class="eyebrow">姿势创作工作台</div>
    <h1>让灵感，<span>有姿态。</span></h1>
    <p>选一个姿势，上传你的照片，生成同一个人物的新画面。</p>
  </div>

  <div class="workspace">
    <!-- 左：姿势库 -->
    <section class="library">
      <div class="section-head">
        <div>
          <div class="step">01</div>
          <h2>选择一个姿势 <span class="count" id="poseCount">0</span></h2>
          <p>结构化姿势库，每个姿势 5 个机位</p>
        </div>
        <div class="search">
          <input id="search" type="search" placeholder="搜索姿势或编号" />
        </div>
      </div>

      <div class="filter-row">
        <div class="tabs" id="tabs">
          <button class="active" data-series="all">全部姿势</button>
          <button data-series="std">全身</button>
          <button data-series="upper">半身</button>
          <button data-series="sexy">风格姿势</button>
          <button data-series="duo">双人</button>
        </div>
        <select id="category"><option>全部分类</option></select>
      </div>

      <div class="library-meta">
        <span>浏览姿势 <b id="poseCount2">0</b></span>
        <label><input type="checkbox" id="adult" /> 显示成人风格姿势</label>
      </div>

      <div class="pose-grid" id="grid"></div>
      <button class="load-more" id="loadMore">查看更多姿势</button>
    </section>

    <!-- 右：创作区 -->
    <section class="create" id="create">
      <div class="step">02</div>
      <h2>开始创作</h2>

      <div class="field-head">
        <span>姿势参考</span>
        <small id="poseSelected">未选择</small>
      </div>
      <div class="pose-ref" id="poseRef">
        <div class="pose-ref-empty">请从左侧选择姿势</div>
      </div>

      <div class="field-head"><span>上传人物照片</span><small>JPG / PNG / WebP</small></div>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden />
      <button class="upload" id="upload">
        <b>点击上传或拖拽图片到这里</b>
        <small>建议清晰的人物正面照，最大 10 MB</small>
      </button>
      <button class="mini" id="composite">合成单图参考（人物 + 线稿拼成一张，给只支持单图的模型用）</button>

      <div class="field-head"><span>画面描述</span><small>选填</small></div>
      <textarea id="prompt" maxlength="1000" placeholder="描述场景、服装或光影，如：写字楼背景，柔和自然光"></textarea>

      <div class="field-head"><span>图片比例</span></div>
      <div class="opts" id="sizes">
        <button class="on" data-size="1024x1536">竖版 2:3</button>
        <button data-size="1024x1024">方形 1:1</button>
        <button data-size="1536x1024">横版 3:2</button>
      </div>

      <div class="field-head"><span>生成模型</span><small id="modelHint">更快出图</small></div>
      <div class="opts" id="models">
        <button class="on" data-model="fast">速度更快</button>
        <button data-model="quality">质量更高</button>
      </div>

      <div class="field-head"><span>API 密钥</span><small>仅存本机</small></div>
      <input id="key" type="password" placeholder="留空 = DEMO 模式（不调用真实模型）" autocomplete="off" />

      <button class="generate" id="generate">开始以图生图</button>
      <p class="note" id="msg"></p>

      <div class="result" id="result" hidden>
        <div class="field-head"><span>生成结果</span><small id="resultMeta"></small></div>
        <div class="result-box" id="resultBox"></div>
      </div>
    </section>
  </div>
</main>

<script src="/assets/app.js"></script>
</body>
</html>
